<header class="view-header">
    <h1 class="view-title">Hardware Connectivity</h1>
    <p class="view-subtitle">Manage your physical device connections and camera integrations.</p>
</header>

<div class="settings-section">
    <h2>Hardware Integration</h2>
    <div class="settings-group">
        <div class="settings-item" style="flex-direction: column; align-items: flex-start; gap: 16px;">
            <div class="settings-info">
                <h4>Tapo C500 Configuration</h4>
                <p>Connect your main indoor camera via WiFi.</p>
            </div>
            <div class="hardware-config-form" style="width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="input-group">
                    <label style="font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; display: block;">IP Address</label>
                    <input type="text" id="tapo-ip" class="form-control" value="192.168.100.6" placeholder="e.g. 192.168.1.100" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px; border-radius: 4px; width: 100%;">
                </div>
                <div class="input-group">
                    <label style="font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; display: block;">WiFi Status</label>
                    <div style="display: flex; align-items: center; gap: 8px; height: 38px;">
                        <span id="tapo-status-dot" class="status-dot" style="background-color: var(--text-secondary);"></span>
                        <span id="tapo-status-text" style="font-size: 13px;">Disconnected</span>
                    </div>
                </div>
                <div class="input-group">
                    <label style="font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; display: block;">RTSP Username</label>
                    <input type="text" id="tapo-user" class="form-control" value="homesecure" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px; border-radius: 4px; width: 100%;">
                </div>
                <div class="input-group">
                    <label style="font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; display: block;">RTSP Password</label>
                    <input type="password" id="tapo-pass" class="form-control" value="qwertyuiop" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px; border-radius: 4px; width: 100%;">
                </div>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 8px;">
                <button class="btn btn-primary" id="save-tapo-config">Update Connection</button>
                <button class="btn btn-outline" id="test-tapo-stream">Test Stream</button>
            </div>
        </div>
    </div>
</div>
