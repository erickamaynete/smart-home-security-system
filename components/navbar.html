<header class="top-navbar" id="top-navbar">
    <button
        type="button"
        id="navbar-back-btn"
        class="navbar-back"
        data-view="dashboard"
        hidden
        aria-label="Go back"
    >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>

    <div class="navbar-left">
        <button
            type="button"
            id="sidebar-toggle"
            class="navbar-burger"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="sidebar-container"
        >
            <span class="navbar-burger-line"></span>
            <span class="navbar-burger-line"></span>
            <span class="navbar-burger-line"></span>
        </button>
        <a href="#" class="navbar-brand" data-view="dashboard" aria-label="HomeSecure home">
            <img
                src="images/homesecure-logo.png"
                alt=""
                class="navbar-logo"
                width="76"
                height="76"
            >
        </a>
    </div>

    <h1 class="navbar-title" id="navbar-title">System Overview</h1>

    <div class="navbar-right">
        <div class="navbar-user-menu">
            <button
                type="button"
                id="navbar-user-toggle"
                class="navbar-user"
                aria-expanded="false"
                aria-controls="navbar-user-dropdown"
                aria-haspopup="true"
            >
                <span class="navbar-user-avatar" id="navbar-user-avatar">AR</span>
                <span class="navbar-user-name" id="navbar-user-name">Alex Rivera</span>
                <svg class="navbar-user-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div id="navbar-user-dropdown" class="navbar-user-dropdown" hidden>
                <div class="navbar-user-dropdown-header">
                    <span class="navbar-user-dropdown-avatar" id="navbar-dropdown-avatar">AR</span>
                    <div class="navbar-user-dropdown-meta">
                        <strong id="navbar-dropdown-name">Alex Rivera</strong>
                        <span id="navbar-dropdown-role">HomeSecure member</span>
                    </div>
                </div>
                <ul class="navbar-user-details">
                    <li>
                        <span class="detail-label">Email</span>
                        <span class="detail-value" id="navbar-dropdown-email">demo@homesecure.com</span>
                    </li>
                    <li>
                        <span class="detail-label">Phone</span>
                        <span class="detail-value" id="navbar-dropdown-phone">—</span>
                    </li>
                </ul>
                <button type="button" class="navbar-dropdown-logout" id="navbar-dropdown-logout">Log Out</button>
            </div>
        </div>
        <a
            href="#alerts"
            class="navbar-icon-btn navbar-notif"
            data-view="alerts"
            aria-label="Notifications"
        >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span id="navbar-notif-badge" class="navbar-notif-badge">3</span>
        </a>
    </div>
</header>
