<header class="view-header">
    <h1 class="view-title">About System</h1>
    <p class="view-subtitle">Device status and software information.</p>
</header>

<div class="settings-section">
    <h2>System</h2>
    <div class="settings-group">
        <div class="settings-item">
            <div class="settings-info">
                <h4>Connected Device</h4>
                <p>HomeSecure Hub v2 — Online</p>
            </div>
            <span class="badge badge-success">Operational</span>
        </div>
        <div class="settings-item">
            <div class="settings-info">
                <h4>Firmware</h4>
                <p>Version v4.1.2</p>
            </div>
            <span style="font-size: 13px; color: var(--text-secondary);">Up to date</span>
        </div>
        <div class="settings-item">
            <div class="settings-info">
                <h4>App Version</h4>
                <p>HomeSecure Web Dashboard</p>
            </div>
            <span style="font-size: 13px; color: var(--text-secondary);">1.0.0</span>
        </div>
        <div class="settings-item" style="flex-direction: column; align-items: flex-start; gap: 16px;">
            <div class="settings-info">
                <h4>Storage Used</h4>
                <p>Local backup and event recordings.</p>
            </div>
            <div style="width: 100%;">
                <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px;">
                    <span>18.4 GB / 64 GB</span>
                    <span style="color: var(--text-secondary);">28%</span>
                </div>
                <div style="height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden;">
                    <div style="width: 28%; height: 100%; background: var(--accent);"></div>
                </div>
            </div>
        </div>
    </div>
</div>
