<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSecure | Smart Home Security</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Modules -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/views.css">
</head>
<body>
    <!-- 
        NOTE: This app must be served via a local HTTP server (e.g., Live Server or python -m http.server)
        to allow component fetching via the Fetch API.
    -->
    
    <div id="app" class="app-container">
        <!-- Sidebar placeholder -->
        <aside id="sidebar-container" class="sidebar"></aside>

        <!-- Main content area -->
        <main id="main-content" class="content">
            <!-- View containers will be injected here -->
            <div id="view-dashboard" class="view" hidden></div>
            <div id="view-cameras" class="view" hidden></div>
            <div id="view-activity" class="view" hidden></div>
            <div id="view-alerts" class="view" hidden></div>
            <div id="view-settings" class="view" hidden></div>
        </main>

        <!-- Alarm Overlay -->
        <div id="alarm-overlay" class="alarm-overlay" hidden>
            <div class="alarm-content">
                <span class="alarm-icon">⚠</span>
                <h1 class="alarm-title">ALARM ACTIVE</h1>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Zoom/Preview Modal -->
    <div id="video-modal" class="modal" hidden>
        <div class="modal-overlay"></div>
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modal-title">Camera Preview</h2>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="video-wrapper">
                    <video id="modal-video" autoplay muted loop playsinline></video>
                    <div class="video-ui">
                        <div class="live-tag">LIVE</div>
                        <div class="timestamp" id="modal-timestamp">2026-05-13 15:50:24</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="camera-controls">
                    <button class="btn btn-outline"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg> Mic</button>
                    <button class="btn btn-outline"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg> Photo</button>
                    <button class="btn btn-danger" id="modal-alarm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg> Siren</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
