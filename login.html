<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | HomeSecure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-top" aria-label="HomeSecure">
                <img
                    src="images/homesecure-logo.png"
                    alt="HomeSecure — Protect your home with confidence"
                    class="auth-brand-logo"
                    width="200"
                    height="200"
                >
            </div>

            <div class="auth-bottom">
                <div class="auth-form-wrap">
                    <div id="signin-panel">
                        <h1 class="auth-panel-heading">Log In</h1>

                        <form id="signin-form" class="auth-form">
                            <div id="auth-error" class="auth-error" hidden></div>

                            <label class="input-icon-field">
                                <span class="field-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                </span>
                                <input type="email" id="signin-email" name="email" placeholder="Email" autocomplete="email" required>
                            </label>

                            <label class="input-icon-field">
                                <span class="field-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                                <input type="password" id="signin-password" name="password" placeholder="Password" autocomplete="current-password" required>
                                <button type="button" class="toggle-password" data-target="signin-password" aria-label="Show password">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </label>

                            <div class="auth-options">
                                <label class="auth-remember">
                                    <input type="checkbox" name="remember" id="remember-me">
                                    <span>Remember me</span>
                                </label>
                                <a href="#" class="auth-forgot-link" id="forgot-link">Forgot password?</a>
                            </div>

                            <button type="submit" class="btn btn-primary btn-auth" id="signin-submit">Log In</button>
                            <p class="auth-switch">
                                Don't have an account?
                                <a href="#" id="show-signup-link">Sign up</a>
                            </p>
                        </form>
                    </div>

                    <div id="forgot-panel" hidden>
                        <h1 class="auth-panel-heading">Reset Password</h1>
                        <p class="auth-form-lead">Enter your account email and choose a new password.</p>

                        <form id="forgot-form" class="auth-form">
                            <div id="forgot-error" class="auth-error" hidden></div>

                            <label class="input-icon-field">
                                <span class="field-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                </span>
                                <input type="email" id="forgot-email" name="email" placeholder="Email" autocomplete="email" required>
                            </label>

                            <label class="input-icon-field">
                                <span class="field-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                                <input type="password" id="forgot-password" name="password" placeholder="New password" autocomplete="new-password" minlength="6" required>
                                <button type="button" class="toggle-password" data-target="forgot-password" aria-label="Show password">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </label>

                            <label class="input-icon-field">
                                <span class="field-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                                <input type="password" id="forgot-confirm" name="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" minlength="6" required>
                                <button type="button" class="toggle-password" data-target="forgot-confirm" aria-label="Show password">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </label>

                            <button type="submit" class="btn btn-primary btn-auth" id="forgot-submit">Reset Password</button>
                            <p class="auth-switch">
                                Remember your password?
                                <a href="#" id="back-to-login-link">Log in</a>
                            </p>
                        </form>
                    </div>

                    <div id="signup-panel" hidden>
                        <h1 class="auth-panel-heading">Sign Up</h1>
                        <p class="auth-form-lead">Sign up to get started.</p>

                        <form id="signup-form" class="auth-form">
                            <div id="signup-error" class="auth-error" hidden></div>

                            <label class="input-icon-field">
                                <span class="field-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </span>
                                <input type="text" id="signup-name" name="name" placeholder="Username" autocomplete="username" required>
                            </label>

                            <label class="input-icon-field">
                                <span class="field-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                                </span>
                                <input type="email" id="signup-email" name="email" placeholder="Email" autocomplete="email" required>
                            </label>

                            <label class="input-icon-field">
                                <span class="field-icon" aria-hidden="true">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                                <input type="password" id="signup-password" name="password" placeholder="Password" autocomplete="new-password" minlength="6" required>
                                <button type="button" class="toggle-password" data-target="signup-password" aria-label="Show password">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                            </label>

                            <button type="submit" class="btn btn-primary btn-auth" id="signup-submit">Sign Up</button>
                            <p class="auth-switch">
                                Already have an account?
                                <a href="#" id="show-login-link">Log in</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
